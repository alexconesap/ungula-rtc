name=UngulaRtc
version=1.0.0
author=Alex Conesa <alexconesap@gmail.com>
maintainer=Alex Conesa <alexconesap@gmail.com>
sentence=Embedded C++20 real-time-clock drivers (DS3231, DS1307) plugging into UngulaCore ITimeProvider for battery-backed wall-clock time.
paragraph=Battery-backed RTC support for embedded projects. Chip-neutral IRtc interface with DS3231 and DS1307 drivers, plus an RtcTimeProvider adapter that routes the chip into ungula::core::time so now() / nowLocal() / formatLocal() flow through the hardware clock automatically. Detects power-loss (DS3231 OSF / DS1307 CH bit) so hosts can re-prompt or re-sync via NTP. Optional multiplexer support for shared I2C buses. Supported targets: ESP32 today via UngulaHal.
category=Timing
url=https://github.com/alexconesap/ungula-rtc.git
includes=ungula_rtc.h
depends=UngulaCore,UngulaHal
architectures=esp32,esp32-s3
